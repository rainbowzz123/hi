<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>收到了一个祝福</title>
<style>
  :root{
    --ink:#3b2f2a;
    --muted:#8d7d72;
    --cream:#f6efe7;
    --green:#55a855;
    --green-2:#478f47;
    --red:#b03a2e;
    --red-2:#953026;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100dvh;
    display:grid;
    place-items:center;
    background:
      radial-gradient(900px 600px at 50% -8%, #fffdf9 0%, rgba(255,253,249,0) 70%),
      linear-gradient(160deg,#f5ede4 0%,#eadfd2 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    padding:20px 0;
  }
  .stage{width:min(92vw,380px);}
  .toplabel{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:13px;color:#9c8d82;margin:0 0 12px;letter-spacing:.04em;
  }
  .toplabel svg{width:13px;height:13px;opacity:.75;}
  .card{
    position:relative;
    background:var(--card);
    border-radius:24px;
    box-shadow:0 20px 55px rgba(92,62,42,.15),0 2px 8px rgba(92,62,42,.06);
    padding:26px 22px 16px;
    min-height:540px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:24px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);pointer-events:none;
  }
  .step{flex:1;display:flex;flex-direction:column;min-height:0;}
  .step.in{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .step[hidden]{display:none;}

  h1{font-size:22px;line-height:1.4;font-weight:600;margin:4px 0 0;letter-spacing:.01em;}
  .sub{font-size:14px;line-height:1.65;color:var(--muted);margin:8px 0 0;}

  .glue-wrap{
    position:relative;flex:1;min-height:180px;
    display:grid;place-items:center;
    margin:6px 0 2px;
  }
  .glow{
    position:absolute;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,150,.45),rgba(255,214,150,0) 68%);
    opacity:0;transform:scale(.8);transition:opacity .4s ease,transform .6s ease;
  }
  .bandaid{
    width:222px;height:auto;
    transform:rotate(-6deg);
    filter:drop-shadow(0 12px 16px rgba(160,110,60,.22));
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  .card.healing .glow{opacity:1;transform:scale(1.15);}
  .card.healing .bandaid{animation:heal .85s cubic-bezier(.34,1.56,.64,1);}
  @keyframes heal{
    0%{transform:rotate(-6deg) scale(1);}
    28%{transform:rotate(-1deg) scale(1.07);}
    55%{transform:rotate(-9deg) scale(.97);}
    78%{transform:rotate(-4deg) scale(1.02);}
    100%{transform:rotate(-6deg) scale(1);}
  }

  .actions{display:flex;gap:12px;margin-top:auto;padding-top:14px;}
  .btn{
    flex:1;height:48px;border:0;border-radius:12px;
    font-family:inherit;font-size:16px;font-weight:600;color:#fff;
    cursor:pointer;touch-action:manipulation;
    transition:transform .16s ease,box-shadow .2s ease,opacity .35s ease;
  }
  .btn:focus-visible{outline:2px solid #3b2f2a;outline-offset:3px;}
  .btn-green{
    background:linear-gradient(180deg,#5cb85c 0%,#4a9f4a 100%);
    box-shadow:0 8px 18px rgba(76,160,76,.28);
  }
  .btn-green:hover{box-shadow:0 10px 22px rgba(76,160,76,.34);}
  .btn-red{
    background:linear-gradient(180deg,#b8453a 0%,#9c3227 100%);
    box-shadow:0 8px 18px rgba(160,52,42,.22);
  }
  .btn:active{transform:scale(.97);}
  .btn-red.dodging{
    position:absolute;left:0;top:0;flex:none;margin:0;z-index:6;
    transform-origin:center;
    transition:left .22s cubic-bezier(.2,.9,.3,1.15),top .22s cubic-bezier(.2,.9,.3,1.15),transform .22s cubic-bezier(.2,.9,.3,1.15),opacity .35s ease;
  }
  .btn-red.gone{opacity:0;transform:scale(.2)!important;}
  .hint{
    margin:10px 0 0;text-align:center;font-size:12px;color:#b3a69b;
  }
  .hint[hidden]{display:none;}
  .plead{
    position:absolute;left:0;top:0;z-index:7;
    max-width:240px;padding:7px 12px;border-radius:10px;
    background:rgba(59,47,42,.92);color:#fff;
    font-size:13px;line-height:1.45;text-align:center;
    pointer-events:none;opacity:0;
    transform:translateY(6px) scale(.96);
    transition:opacity .22s ease,transform .22s ease;
    box-shadow:0 8px 18px rgba(59,47,42,.18);
  }
  .plead.show{opacity:1;transform:none;}
  .music-btn{
    position:fixed;right:16px;top:16px;width:42px;height:42px;
    border:0;border-radius:50%;background:rgba(255,255,255,.86);
    box-shadow:0 8px 20px rgba(90,60,40,.16);
    display:grid;place-items:center;cursor:pointer;z-index:30;
    backdrop-filter:blur(6px);transition:transform .15s ease;
  }
  .music-btn:active{transform:scale(.94);}
  .music-btn .bars{display:flex;align-items:flex-end;gap:3px;height:15px;}
  .music-btn .bars i{display:block;width:3px;height:5px;background:#8d7d72;border-radius:2px;transition:height .2s ease;}
  .music-btn.playing .bars i{animation:eq .9s ease-in-out infinite;}
  .music-btn.playing .bars i:nth-child(2){animation-delay:.15s;}
  .music-btn.playing .bars i:nth-child(3){animation-delay:.3s;}
  @keyframes eq{0%,100%{height:5px}50%{height:15px}}
  .music-btn.missing::after{
    content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;
    border-radius:50%;background:#d9534f;
  }
  .bgm-toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(8px);
    background:rgba(52,42,36,.92);color:#fff;font-size:12px;
    padding:9px 14px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;white-space:nowrap;z-index:40;
  }
  .bgm-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .done{text-align:center;justify-content:center;padding:6px 2px 4px;}
  .badge{
    align-self:center;display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:#4a8a4a;background:#edf7ed;
    border:1px solid #d7ecd7;border-radius:999px;padding:5px 12px;
  }
  .success-photo{
    display:block;width:100%;aspect-ratio:3/4;object-fit:cover;
    border-radius:16px;margin:16px 0 0;
    box-shadow:0 14px 30px rgba(70,45,30,.2);
  }
  .ghost{
    margin:14px auto 0;border:0;background:none;color:#a89a90;
    font-family:inherit;font-size:13px;cursor:pointer;padding:6px 10px;
  }
  .ghost:hover{color:#7d6f66;}

  .skip{justify-content:center;text-align:center;}
  .skip h1{font-size:21px;}
  .skip p{font-size:14px;line-height:1.8;color:var(--muted);margin:14px 6px 0;}
  .skip .btn{margin-top:24px;flex:none;width:100%;}

  .pager{
    margin-top:14px;text-align:center;font-size:12px;color:#b8aca2;letter-spacing:.08em;
  }
  .footnote{
    text-align:center;font-size:11px;color:#b9ada3;margin:14px 0 0;letter-spacing:.02em;
  }
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(8px);
    background:rgba(52,42,36,.92);color:#fff;font-size:13px;
    padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .heart-particle{
    position:absolute;left:50%;top:45%;font-size:16px;pointer-events:none;
    animation:floatUp 1.25s ease-out forwards;
  }
  @keyframes floatUp{
    0%{opacity:1;transform:translate(0,0) scale(.7);}
    100%{opacity:0;transform:translate(var(--dx),-96px) scale(1.15);}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  }
</style>
</head>

<div class="stage">
  <div class="toplabel">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.3-9.1C1.2 8.2 3.6 4.5 7.5 4.5c2 0 3.5 1 4.5 2.5 1-1.5 2.5-2.5 4.5-2.5 3.9 0 6.3 3.7 4.8 7.4C19.5 16.4 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    收到了一个祝福

  <section class="card" id="card" aria-live="polite">

            <ellipse cx="104" cy="55" rx="4.6" ry="6" fill="#7a4a2e"/>
            <ellipse cx="136" cy="55" rx="4.6" ry="6" fill="#7a4a2e"/>
            <ellipse cx="92" cy="66" rx="7" ry="4.4" fill="#f2a58c" opacity=".55"/>
            <ellipse cx="148" cy="66" rx="7" ry="4.4" fill="#f2a58c" opacity=".55"/>
            <path d="M104 68c4.5 6.5 27 6.5 32 0" stroke="#7a4a2e" stroke-width="3.4" stroke-linecap="round" fill="none"/>
            <path d="M28 34c8-6 20-7 28-5" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55"/>
            <path d="M184 86c8 6 20 7 28 5" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".35"/>
          </g>
        </svg>
      </div>

      <div class="actions">
        <button class="btn btn-green" id="useBtn" type="button">使用复原胶</button>
        <button class="btn btn-red" id="skipBtn" type="button">暂不修复</button>
      </div>
    </div>

<script>
(() => {
  const card = document.getElementById('card');
  const steps = Array.from(document.querySelectorAll('.step'));
  const pager = document.getElementById('pagerText');
  const useBtn = document.getElementById('useBtn');
  const skipBtn = document.getElementById('skipBtn');
  const againBtn = document.getElementById('againBtn');
  const backBtn = document.getElementById('backBtn');
  const plead = document.getElementById('plead');
  let pleadTimer = 0;

  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('musicBtn');
  const bgmToast = document.getElementById('bgmToast');
  const BGM_SOURCES = ['bgm.mp3', 'bgm.ogg', '我不难过.mp3', '我不难过.ogg'];
  const BGM_START = 0;
  let bgmIndex = 0, bgmOk = false, bgmMissing = false, musicOn = false, bgmStarting = false;
  let bgmStarted = false;
  let fadeRaf = 0, bgmToastTimer = 0;

  function tryNextBgm() {
    if (bgmIndex >= BGM_SOURCES.length) {
      bgmMissing = true;
      musicBtn.classList.add('missing');
      musicBtn.title = '未找到 bgm.mp3';
      return;
    }
    bgm.src = BGM_SOURCES[bgmIndex];
    bgm.load();
  }
  bgm.addEventListener('canplaythrough', () => { bgmOk = true; });
  bgm.addEventListener('error', () => {
    if (!bgmOk) { bgmIndex += 1; tryNextBgm(); }
  });
  tryNextBgm();

  function fadeTo(target, ms, done) {
    cancelAnimationFrame(fadeRaf);
    const from = bgm.volume;
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      bgm.volume = Math.max(0, Math.min(1, from + (target - from) * k));
      if (k < 1) fadeRaf = requestAnimationFrame(step);
      else if (done) done();
    };
    fadeRaf = requestAnimationFrame(step);
  }

  function showBgmToast(msg) {
    bgmToast.textContent = msg;
    bgmToast.classList.add('show');
    clearTimeout(bgmToastTimer);
    bgmToastTimer = window.setTimeout(() => bgmToast.classList.remove('show'), 2400);
  }

  async function playBgm() {
    if (musicOn || bgmStarting) return;
    if (bgmMissing) { showBgmToast('把 bgm.mp3 放到页面同目录就能播放'); return; }
    bgmStarting = true;
    try {
      if (!bgmStarted) {
        if (bgm.readyState < 1) {
          await new Promise((resolve) => {
            const done = () => resolve();
            bgm.addEventListener('loadedmetadata', done, { once: true });
            window.setTimeout(done, 1500);
          });
        }
        bgm.currentTime = BGM_START;
        bgmStarted = true;
      } else if (bgm.duration && bgm.currentTime > bgm.duration - 1.5) {
        bgm.currentTime = BGM_START;
      }
      bgm.volume = 0;
      await bgm.play();
      musicOn = true;
      musicBtn.classList.add('playing');
      fadeTo(0.45, 1200);
    } catch (e) {
      showBgmToast('点一下页面再试试播放');
    } finally {
      bgmStarting = false;
    }
  }

  function pauseBgm() {
    if (!musicOn) return;
    musicOn = false;
    musicBtn.classList.remove('playing');
    fadeTo(0, 280, () => bgm.pause());
  }

  musicBtn.addEventListener('click', () => { musicOn ? pauseBgm() : playBgm(); });
  bgm.addEventListener('ended', () => {
    bgm.currentTime = BGM_START;
    if (musicOn) bgm.play().catch(() => {});
  });
  document.addEventListener('pointerdown', () => {
    if (!musicOn && !bgmMissing) playBgm();
  }, { once: true });

  const PLEAS = [
    '不要这么狠心好不好...',
    '再想一想嘛，就一下下',
    '它都躲到这儿了，心软一下？',
    '别急着走，听我说完',
    '就再给一次机会，好不好',
    '你看它都跑累了',
    '这次真的不一样了',
    '点左边那个，求求了',
    '我保证，不会再让你难过',
    '躲这么久，你还没笑吗'
  ];
  let pleadIndex = 0;
  const actionsEl = document.querySelector('.actions');
  const skipOriginalParent = skipBtn.parentNode;
  const skipOriginalNext = skipBtn.nextSibling;

  function showStep(name) {
    steps.forEach(s => { s.hidden = s.dataset.step !== name; });
    pager.textContent = name === 'done' ? '2 / 2' : '1 / 2';
    skipBtn.style.display = name === 'ask' ? '' : 'none';
    if (name !== 'ask') plead.classList.remove('show');
    const active = steps.find(s => s.dataset.step === name);
    active.classList.remove('in');
    void active.offsetWidth;
    active.classList.add('in');
  }

  useBtn.addEventListener('click', () => {
    playBgm();
    card.classList.add('healing');
    window.setTimeout(() => {
      card.classList.remove('healing');
      showStep('done');
      burstHearts();
    }, 820);
  });

  let dodges = 0;
  let scale = 1;
  let escaped = false;
  let lastDodge = 0;

  function resetDodge() {
    dodges = 0;
    scale = 1;
    escaped = false;
    skipBtn.hidden = false;
    skipBtn.classList.remove('dodging', 'gone');
    skipBtn.removeAttribute('style');
    if (skipBtn.parentNode !== skipOriginalParent) {
      skipOriginalParent.insertBefore(skipBtn, skipOriginalNext);
    }
    skipBtn.style.display = '';
    pleadIndex = 0;
    plead.classList.remove('show');
  }

  function dodge(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    const now = Date.now();
    if (now - lastDodge < 130) return;
    lastDodge = now;

    const cardRect = card.getBoundingClientRect();

    if (!escaped) {
      const r = skipBtn.getBoundingClientRect();
      const c = card.getBoundingClientRect();
      skipBtn.style.width = r.width + 'px';
      skipBtn.style.height = r.height + 'px';
      skipBtn.style.left = (r.left - c.left) + 'px';
      skipBtn.style.top = (r.top - c.top) + 'px';
      skipBtn.classList.add('dodging');
      card.appendChild(skipBtn);
      escaped = true;
    }

    const bw = skipBtn.offsetWidth;
    const bh = skipBtn.offsetHeight;
    const pad = 16;
    const g = useBtn.getBoundingClientRect();
    const gx1 = g.left - cardRect.left;
    const gy1 = g.top - cardRect.top;
    const gx2 = g.right - cardRect.left;
    const gy2 = g.bottom - cardRect.top;

    let x = pad;
    let y = pad;
    for (let i = 0; i < 24; i++) {
      x = pad + Math.random() * Math.max(1, card.clientWidth - bw - pad * 2);
      y = pad + Math.random() * Math.max(1, card.clientHeight - bh - pad * 2);
      const overlap = x < gx2 + 10 && x + bw > gx1 - 10 && y < gy2 + 10 && y + bh > gy1 - 10;
      if (!overlap) break;
    }

    dodges += 1;
    scale = Math.max(0.55, 1 - dodges * 0.09);
    skipBtn.style.left = x + 'px';
    skipBtn.style.top = y + 'px';
    skipBtn.style.transform = 'scale(' + scale + ')';
    skipBtn.style.opacity = scale < 0.34 ? '0.55' : '1';
    skipBtn.blur();
    showPlead(x, y, bw, bh, scale);

  }

  ['pointerenter', 'pointerdown', 'touchstart', 'mouseenter'].forEach(evt => {
    skipBtn.addEventListener(evt, dodge, { passive: false });
  });
  skipBtn.addEventListener('click', dodge);
  skipBtn.addEventListener('focus', () => {
    window.setTimeout(dodge, 60);
  });

  function showPlead(x, y, bw, bh, sc) {
    plead.textContent = PLEAS[pleadIndex % PLEAS.length];
    pleadIndex += 1;
    plead.classList.remove('show');
    void plead.offsetWidth;
    const pw = plead.offsetWidth;
    const ph = plead.offsetHeight;
    const vw = bw * sc;
    const vh = bh * sc;
    const bx = x + (bw - vw) / 2;
    const by = y + (bh - vh) / 2;
    let left = bx + vw / 2 - pw / 2;
    left = Math.max(10, Math.min(left, card.clientWidth - pw - 10));
    let top = by - ph - 8;
    if (top < 8) top = by + vh + 8;
    top = Math.max(8, Math.min(top, card.clientHeight - ph - 8));
    plead.style.left = left + 'px';
    plead.style.top = top + 'px';
    plead.classList.add('show');
    window.clearTimeout(pleadTimer);
    pleadTimer = window.setTimeout(() => plead.classList.remove('show'), 1400);
  }

  againBtn.addEventListener('click', () => {
    resetDodge();
    showStep('ask');
  });
  backBtn.addEventListener('click', () => showStep('ask'));

  function burstHearts() {
    const wrap = card.querySelector('.glue-wrap');
    if (!wrap) return;
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('span');
      s.className = 'heart-particle';
      s.textContent = '♥';
      s.style.color = i % 2 ? '#e46a5c' : '#ef9a8b';
      s.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(0) + 'px');
      s.style.left = (30 + Math.random() * 40) + '%';
      s.style.animationDelay = (Math.random() * 0.25).toFixed(2) + 's';
      wrap.appendChild(s);
      window.setTimeout(() => s.remove(), 1700);
    }
  }
})();
</script>
</body>
</html>
